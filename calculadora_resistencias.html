<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculadora de resistencias comerciales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e8eef2; --grid:#d3dde4; --panel:#f8fafb; --ink:#13212c; --muted:#53636f;
  --line:#b9c6cf; --accent:#1f4fd8; --accent-ink:#fff; --ok:#0f6b3f; --warn:#9a4a00;
  --ok-bg:#dff3e7; --warn-bg:#fdebd3;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1a22; --grid:#17262f; --panel:#15242e; --ink:#e7eff4; --muted:#9db0bc;
    --line:#2b414f; --accent:#6f95ff; --accent-ink:#0b1220; --ok:#6fe0a3; --warn:#ffb866;
    --ok-bg:#12372a; --warn-bg:#3a2a12;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1a22; --grid:#17262f; --panel:#15242e; --ink:#e7eff4; --muted:#9db0bc;
  --line:#2b414f; --accent:#6f95ff; --accent-ink:#0b1220; --ok:#6fe0a3; --warn:#ffb866;
  --ok-bg:#12372a; --warn-bg:#3a2a12;
}
*{box-sizing:border-box}
html{height:100%}
body{
  margin:0; min-height:100%; color:var(--ink); background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; font-size:16px; line-height:1.5;
  font-variant-numeric:tabular-nums;
}
main{max-width:920px; margin:0 auto; padding:40px 20px 64px}
h1,h2,h3{font-family:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif; line-height:1.1; margin:0}
h1{font-size:clamp(2rem,5vw,3.2rem); font-weight:800; letter-spacing:-.02em}
.lead{color:var(--muted); max-width:60ch; margin:12px 0 28px}
.panel{background:var(--panel); border:1.5px solid var(--line); border-radius:14px; padding:22px}
form{display:grid; grid-template-columns:2fr 1.2fr 1.6fr auto; gap:16px; align-items:end}
label,.lbl{display:block; font-size:.88rem; font-weight:600; margin-bottom:6px}
.row{display:flex; gap:8px}
input[type=number],select{
  width:100%; height:46px; padding:0 12px; font:inherit; color:var(--ink);
  background:var(--bg); border:1.5px solid var(--line); border-radius:9px;
}
input:focus-visible,select:focus-visible,button:focus-visible,.seg input:focus-visible+span{outline:3px solid var(--accent); outline-offset:2px}
.seg{display:flex; border:1.5px solid var(--line); border-radius:9px; overflow:hidden; height:46px; background:var(--bg)}
.seg label{flex:1; margin:0; position:relative; font-weight:500}
.seg input{position:absolute; opacity:0; inset:0}
.seg span{display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; cursor:pointer; line-height:1.15; font-size:.95rem}
.seg small{font-size:.72rem; color:var(--muted)}
.seg input:checked+span{background:var(--accent); color:var(--accent-ink)}
.seg input:checked+span small{color:var(--accent-ink); opacity:.85}
button.go{
  height:46px; padding:0 26px; border:0; border-radius:9px; background:var(--accent); color:var(--accent-ink);
  font:600 1rem "IBM Plex Sans",sans-serif; cursor:pointer;
}
button.go:hover{filter:brightness(1.08)}
.err{color:var(--warn); margin:12px 0 0; min-height:1.4em; font-weight:500}
#out{margin-top:28px}
.hero{display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); gap:26px; align-items:center}
.hero .big{font-family:"Bricolage Grotesque",sans-serif; font-weight:800; font-size:clamp(2rem,6vw,3.4rem); line-height:1; letter-spacing:-.02em}
.hero p{margin:6px 0 0; color:var(--muted)}
.chip{display:inline-block; margin-top:12px; padding:4px 12px; border-radius:99px; font-size:.88rem; font-weight:600}
.chip.ok{background:var(--ok-bg); color:var(--ok)}
.chip.bad{background:var(--warn-bg); color:var(--warn)}
.tabs{display:flex; gap:6px; flex-wrap:wrap; margin:30px 0 14px}
.tabs button{
  padding:9px 16px; font:600 .92rem "IBM Plex Sans",sans-serif; color:var(--ink); cursor:pointer;
  background:var(--panel); border:1.5px solid var(--line); border-radius:99px;
}
.tabs button[aria-selected=true]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.card{display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:18px; align-items:center; margin-bottom:12px; padding:16px 20px}
.card .diag{overflow-x:auto; color:var(--ink)}
.card .diag svg{display:block; max-width:100%; height:auto}
.card h3{font-size:1.15rem; font-weight:700}
.card .formula{color:var(--muted); font-size:.92rem; margin:4px 0 8px; overflow-wrap:anywhere}
.card .val{font-weight:600}
.small{color:var(--muted); font-size:.85rem; margin-top:20px}
@media (max-width:760px){
  form{grid-template-columns:1fr 1fr}
  form>.span2,form>button{grid-column:1/-1}
  .hero,.card{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <h1>Calculadora de resistencias comerciales</h1>
  <p class="lead">Escribe el valor que necesitas y elige la tolerancia. El programa prueba una, dos y tres resistencias en todas las combinaciones serie y paralelo posibles, y te muestra las que más se acercan.</p>

  <form class="panel" id="f" novalidate>
    <div>
      <label for="valor">Valor deseado</label>
      <div class="row">
        <input id="valor" type="number" step="any" min="0" inputmode="decimal" value="330" required>
      </div>
    </div>
    <div>
      <label for="unidad">Unidad</label>
      <select id="unidad">
        <option value="1">Ω</option><option value="1e3">kΩ</option><option value="1e6">MΩ</option>
      </select>
    </div>
    <div class="span2">
      <span class="lbl" id="tl">Tolerancia</span>
      <div class="seg" role="radiogroup" aria-labelledby="tl">
        <label><input type="radio" name="tol" value="10" checked><span>10 %<small>serie E12</small></span></label>
        <label><input type="radio" name="tol" value="1"><span>1 %<small>serie E96</small></span></label>
      </div>
    </div>
    <button class="go" type="submit">Calcular</button>
  </form>
  <p class="err" id="err" role="alert"></p>

  <section id="out" hidden>
    <div class="panel hero" id="hero"></div>
    <div class="tabs" id="tabs" role="tablist"></div>
    <div id="list"></div>
    <p class="small" id="note"></p>
  </section>
</main>

<script>
const E12=[10,12,15,18,22,27,33,39,47,56,68,82];
const E96=[100,102,105,107,110,113,115,118,121,124,127,130,133,137,140,143,147,150,154,158,162,165,169,174,178,182,187,191,196,200,205,210,215,221,226,232,237,243,249,255,261,267,274,280,287,294,301,309,316,324,332,340,348,357,365,374,383,392,402,412,422,432,442,453,464,475,487,499,511,523,536,549,562,576,590,604,619,634,649,665,681,698,715,732,750,768,787,806,825,845,866,887,909,931,953,976];
const COLORS=['#161616','#7b4a2d','#d33a2c','#f08a24','#f2d13c','#3a9a4b','#3a6fd1','#8a4bd1','#8a8f94','#f4f4f4'];
const MULT=e=>e===-2?'#c0c4c8':e===-1?'#c9a227':COLORS[e];
const NAMES={R:'Una resistencia',S2:'Dos en serie',P2:'Dos en paralelo',S3:'Tres en serie',P3:'Tres en paralelo',SP:'Una en serie con dos en paralelo',PS:'Una en paralelo con dos en serie'};

function fmt(v){
  let u='Ω',x=v;
  if(v>=1e6){x=v/1e6;u='MΩ'}else if(v>=1e3){x=v/1e3;u='kΩ'}
  return (+x.toPrecision(4)).toString().replace('.',',')+' '+u;
}
const pct=x=>x.toFixed(x<0.1?3:2).replace('.',',')+' %';

/* Valores comerciales dentro de una ventana alrededor del objetivo */
function buildValues(T,tol){
  const base=tol===10?E12:E96, nd=tol===10?2:3, out={v:[],b:[],e:[],nd,tol};
  for(let e=-2;e<=8;e++) for(const b of base){
    const v=e>=0?b*10**e:b/10**-e;
    if(v>=1&&v<=1e7&&v>=T/100&&v<=T*100){out.v.push(v);out.b.push(b);out.e.push(e)}
  }
  return out;
}

/* Búsqueda de todas las combinaciones serie/paralelo con 1, 2 y 3 resistencias */
function search(T,S){
  const v=S.v,n=v.length,inv=v.map(x=>1/x);
  const L={1:[],2:[],3:[]},thr={1:Infinity,2:Infinity,3:Infinity};
  const add=(c,e,t,i,j,k)=>{
    const a=L[c]; a.push({e,t,i,j,k,n:c});
    if(a.length>400){a.sort((x,y)=>x.e-y.e); a.length=30; thr[c]=a[29].e}
  };
  for(let i=0;i<n;i++){
    let e=Math.abs(v[i]-T); if(e<thr[1]) add(1,e,'R',i);
    for(let j=i;j<n;j++){
      e=Math.abs(v[i]+v[j]-T); if(e<thr[2]) add(2,e,'S2',i,j);
      e=Math.abs(1/(inv[i]+inv[j])-T); if(e<thr[2]) add(2,e,'P2',i,j);
      for(let k=j;k<n;k++){
        e=Math.abs(v[i]+v[j]+v[k]-T); if(e<thr[3]) add(3,e,'S3',i,j,k);
        e=Math.abs(1/(inv[i]+inv[j]+inv[k])-T); if(e<thr[3]) add(3,e,'P3',i,j,k);
      }
    }
  }
  /* Mixtas: a puede ser cualquiera; b y c forman el par */
  for(let a=0;a<n;a++) for(let j=0;j<n;j++) for(let k=j;k<n;k++){
    const par=1/(inv[j]+inv[k]);
    let e=Math.abs(v[a]+par-T); if(e<thr[3]) add(3,e,'SP',a,j,k);
    const ser=v[j]+v[k];
    e=Math.abs(v[a]*ser/(v[a]+ser)-T); if(e<thr[3]) add(3,e,'PS',a,j,k);
  }
  for(const c of [1,2,3]) L[c].sort((x,y)=>x.e-y.e||0);
  return L;
}

function valueOf(r,S){
  const a=S.v[r.i],b=S.v[r.j],c=S.v[r.k];
  switch(r.t){
    case 'R':return a; case 'S2':return a+b; case 'P2':return a*b/(a+b);
    case 'S3':return a+b+c; case 'P3':return 1/(1/a+1/b+1/c);
    case 'SP':return a+b*c/(b+c); case 'PS':return a*(b+c)/(a+b+c);
  }
}
function formula(r,S){
  const f=x=>fmt(S.v[x]),a=f(r.i),b=r.j!=null?f(r.j):'',c=r.k!=null?f(r.k):'';
  return {R:a,S2:`${a} + ${b}`,P2:`${a} ∥ ${b}`,S3:`${a} + ${b} + ${c}`,P3:`${a} ∥ ${b} ∥ ${c}`,
          SP:`${a} + (${b} ∥ ${c})`,PS:`${a} ∥ (${b} + ${c})`}[r.t];
}
function tree(r){
  const R=i=>({t:'R',i});
  return {R:R(r.i),S2:{t:'S',c:[R(r.i),R(r.j)]},P2:{t:'P',c:[R(r.i),R(r.j)]},
    S3:{t:'S',c:[R(r.i),R(r.j),R(r.k)]},P3:{t:'P',c:[R(r.i),R(r.j),R(r.k)]},
    SP:{t:'S',c:[R(r.i),{t:'P',c:[R(r.j),R(r.k)]}]},
    PS:{t:'P',c:[R(r.i),{t:'S',c:[R(r.j),R(r.k)]}]}}[r.t];
}

/* Dibujo del circuito con resistencias en código de colores */
function ln(x1,y1,x2,y2){return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`}
function draw(n,S){
  if(n.t==='R'){
    const b=S.b[n.i],e=S.e[n.i],d=String(b).split('').map(Number),cols=d.map(x=>COLORS[x]);
    cols.push(MULT(e));
    let s=ln(0,27,12,27)+ln(72,27,84,27);
    s+=`<text x="42" y="10" text-anchor="middle" font-size="11" fill="currentColor" stroke="none">${fmt(S.v[n.i])}</text>`;
    s+=`<rect x="12" y="16" width="60" height="22" rx="6" fill="#d8c79f" stroke="currentColor"/>`;
    cols.forEach((c,q)=>{s+=`<rect x="${18+q*8}" y="17" width="5" height="20" fill="${c}" stroke="none"/>`});
    s+=`<rect x="56" y="17" width="5" height="20" fill="${S.tol===10?'#c0c4c8':COLORS[1]}" stroke="none"/>`;
    return {w:84,h:44,cy:27,s};
  }
  const k=n.c.map(c=>draw(c,S));
  if(n.t==='S'){
    const cy=Math.max(...k.map(c=>c.cy)); let x=0,s='',h=0;
    k.forEach(c=>{s+=`<g transform="translate(${x},${cy-c.cy})">${c.s}</g>`;x+=c.w;h=Math.max(h,cy-c.cy+c.h)});
    return {w:x,h,cy,s};
  }
  const W=Math.max(...k.map(c=>c.w)); let y=0,s='',cys=[];
  k.forEach(c=>{
    const x=12+(W-c.w)/2,cy=y+c.cy; cys.push(cy);
    s+=`<g transform="translate(${x},${y})">${c.s}</g>`+ln(6,cy,x,cy)+ln(x+c.w,cy,W+18,cy);
    y+=c.h+8;
  });
  const mid=(cys[0]+cys[cys.length-1])/2;
  s+=ln(6,cys[0],6,cys[cys.length-1])+ln(W+18,cys[0],W+18,cys[cys.length-1])+ln(0,mid,6,mid)+ln(W+18,mid,W+24,mid);
  return {w:W+24,h:y-8,cy:mid,s};
}
function svg(r,S){
  const d=draw(tree(r),S);
  return `<svg viewBox="0 0 ${d.w} ${d.h}" width="${d.w}" role="img" aria-label="${NAMES[r.t]}: ${formula(r,S)}" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" font-family="IBM Plex Sans,sans-serif">${d.s}</svg>`;
}

/* Interfaz */
const $=id=>document.getElementById(id);
let state=null;

function card(r,S,T){
  const val=valueOf(r,S),err=Math.abs(val-T)/T*100,ok=err<=S.tol;
  return `<article class="panel card"><div class="diag">${svg(r,S)}</div><div>
    <h3>${NAMES[r.t]}</h3><div class="formula">${formula(r,S)}</div>
    <div class="val">= ${fmt(val)}</div>
    <span class="chip ${ok?'ok':'bad'}">Error ${pct(err)} · ${ok?'dentro':'fuera'} de ±${S.tol} %</span></div></article>`;
}
function showTab(key){
  const {S,T,L,all}=state;
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.k===key));
  const list=key==='all'?all.slice(0,8):L[key].slice(0,6);
  $('list').innerHTML=list.map(r=>card(r,S,T)).join('');
}
function run(){
  const T=parseFloat($('valor').value)*parseFloat($('unidad').value);
  const tol=+document.querySelector('input[name=tol]:checked').value;
  $('err').textContent='';
  if(!(T>0)){ $('err').textContent='Escribe un valor mayor que cero.'; return }
  if(T<1||T>1e7){ $('err').textContent='Usa un valor entre 1 Ω y 10 MΩ.'; return }
  $('err').textContent='Calculando…';
  setTimeout(()=>{
    const S=buildValues(T,tol),L=search(T,S);
    const all=[...L[1],...L[2],...L[3]].sort((a,b)=>(a.e/T-b.e/T)||(a.n-b.n));
    state={S,T,L,all};
    const best=all[0],bv=valueOf(best,S),berr=Math.abs(bv-T)/T*100,ok=berr<=tol;
    $('hero').innerHTML=`<div><div class="lbl">Mejor opción para ${fmt(T)}</div>
      <div class="big">${fmt(bv)}</div><p>${formula(best,S)}</p>
      <span class="chip ${ok?'ok':'bad'}">Error ${pct(berr)} · ${ok?'dentro':'fuera'} de ±${tol} %</span></div>
      <div class="diag" style="overflow-x:auto">${svg(best,S)}</div>`;
    $('tabs').innerHTML=[['all','Mejores en total'],[1,'1 resistencia'],[2,'2 resistencias'],[3,'3 resistencias']]
      .map(([k,t])=>`<button role="tab" data-k="${k}" aria-selected="false">${t}</button>`).join('');
    document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>showTab(b.dataset.k));
    $('note').textContent=`Se usaron ${S.v.length} valores comerciales de la serie ${tol===10?'E12 (10 %)':'E96 (1 %)'} y se evaluaron las combinaciones serie y paralelo de 1, 2 y 3 resistencias.`;
    $('out').hidden=false; $('err').textContent='';
    showTab('all');
  },30);
}
$('f').addEventListener('submit',e=>{e.preventDefault();run()});
run();
</script>
</body>
</html>
